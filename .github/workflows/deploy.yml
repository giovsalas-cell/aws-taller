name: Taller1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: obtener el codigo
        uses: actions/checkout@v4

      - name: copiar archivos al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.IP_PUBLICA }}
          username: ${{ secrets.username }}
          key: ${{ secrets.key }}
          source: "."
          target: "/home/${{ secrets.username }}/proyecto1"
          overwrite: true

      - name: levantar contenedor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_PUBLICA }}
          username: ${{ secrets.username }}
          key: ${{ secrets.key }}
          script: |
            cd ~/proyecto1
            docker compose down
            docker compose up -d --build
